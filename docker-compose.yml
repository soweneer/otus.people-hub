x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  expose:
    - "8080"
  environment: &app-env
    ConnectionStrings__PostgreSql: "Host=pg-master:5432,haproxy:5001;Database=people_hub;Username=postgres;Password=postgres;Maximum Pool Size=30;"
    ConnectionStrings__Redis: "redis:6379"
    ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672/"
    ChatsService__Address: "http://chats:8081"
    FeatureFlags__UseCacheForFeed: "${USE_CACHE_FOR_FEED:-true}"
    RunMigrationsOnStartup: "false"
  depends_on:
    pg-master:
      condition: service_healthy
    haproxy:
      condition: service_started
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    chats:
      condition: service_healthy
    prometheus:
      condition: service_started
    grafana:
      condition: service_started

services:
  pg-master:
    image: postgres:18.4
    container_name: pg-master
    environment:
      POSTGRES_DB: people_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "5432:5432"
    volumes:
      - pg-master-data:/var/lib/postgresql
      - ./docker/master-init.sh:/docker-entrypoint-initdb.d/master-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d people_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  pg-replica-1:
    image: postgres:18.4
    container_name: pg-replica-1
    user: postgres
    environment:
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
      REPLICATION_SLOT: replica_1_slot
      REPLICA_NAME: replica_1
    entrypoint: ["bash", "/usr/local/bin/replica-init.sh"]
    ports:
      - "5443:5432"
    volumes:
      - pg-replica-1-data:/var/lib/postgresql
      - ./docker/replica-init.sh:/usr/local/bin/replica-init.sh:ro
    depends_on:
      pg-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  pg-replica-2:
    image: postgres:18.4
    container_name: pg-replica-2
    user: postgres
    environment:
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
      REPLICATION_SLOT: replica_2_slot
      REPLICA_NAME: replica_2
    entrypoint: ["bash", "/usr/local/bin/replica-init.sh"]
    ports:
      - "5444:5432"
    volumes:
      - pg-replica-2-data:/var/lib/postgresql
      - ./docker/replica-init.sh:/usr/local/bin/replica-init.sh:ro
    depends_on:
      pg-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  pg-chats:
    image: postgres:18.4
    container_name: pg-chats
    environment:
      POSTGRES_DB: people_hub_chats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg-chats-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d people_hub_chats"]
      interval: 5s
      timeout: 3s
      retries: 10

  haproxy:
    image: haproxy:3.2-alpine
    container_name: haproxy
    ports:
      - "5001:5001"
      - "8404:8404"
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      pg-replica-1:
        condition: service_healthy
      pg-replica-2:
        condition: service_healthy

  tarantool:
    image: tarantool/tarantool:3.4.0
    container_name: tarantool
    entrypoint: ["tarantool", "--config", "/opt/tarantool/config.yaml"]
    ports:
      - "3301:3301"
    volumes:
      - ./docker/tarantool:/opt/tarantool:ro
      - tarantool-data:/var/lib/tarantool
    healthcheck:
      test: ["CMD-SHELL", "tarantool -e \"local c = require('net.box').connect('127.0.0.1:3301'); os.exit(pcall(function() return c:call('dialog_stats') end) and 0 or 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10

  chats:
    build:
      context: .
      dockerfile: src/backend/PeopleHub.Chats/Dockerfile
    container_name: people-hub-chats
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_URLS: "http://+:8081"
      Kestrel__EndpointDefaults__Protocols: "Http2"
      ConnectionStrings__PostgreSql: "Host=pg-chats:5432;Database=people_hub_chats;Username=postgres;Password=postgres;"
      ConnectionStrings__Tarantool: "tarantool:3301"
      FeatureFlags__UseTarantoolStorage: "${USE_TARANTOOL_STORAGE:-true}"
      RunMigrationsOnStartup: "${RUN_MIGRATIONS_ON_STARTUP:-true}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      pg-chats:
        condition: service_healthy
      tarantool:
        condition: service_healthy

  feed:
    build:
      context: .
      dockerfile: src/backend/PeopleHub.Feed/Dockerfile
    container_name: people-hub-feed
    expose:
      - "8082"
    environment:
      ASPNETCORE_URLS: "http://+:8082"
      ConnectionStrings__PostgreSql: "Host=pg-master:5432;Database=people_hub;Username=postgres;Password=postgres;"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      pg-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  redis:
    image: redis:8.0-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  nginx:
    image: nginx:1.27-alpine
    container_name: people-hub-nginx
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-1:
        condition: service_started
      app-2:
        condition: service_started
      app-3:
        condition: service_started
      feed:
        condition: service_started

  app-1:
    <<: *app
    container_name: people-hub-app-1
    environment:
      <<: *app-env
      RunMigrationsOnStartup: "${APP_RUN_MIGRATIONS:-false}"

  app-2:
    <<: *app
    container_name: people-hub-app-2

  app-3:
    <<: *app
    container_name: people-hub-app-3

volumes:
  pg-master-data:
  pg-replica-1-data:
  pg-replica-2-data:
  pg-chats-data:
  tarantool-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
