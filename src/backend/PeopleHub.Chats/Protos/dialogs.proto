syntax = "proto3";

option csharp_namespace = "PeopleHub.Chats.Grpc";

package dialogs;

service Dialogs {
  rpc Send (SendRequest) returns (SendResponse);
  rpc List (ListRequest) returns (ListResponse);
  rpc GetPartners (PartnersRequest) returns (PartnersResponse);
  rpc MarkRead (MarkReadRequest) returns (MarkReadResponse);
  rpc GetUnreadCounts (UnreadCountsRequest) returns (UnreadCountsResponse);
}

message SendRequest {
  int64 from_user_id = 1;
  int64 to_user_id = 2;
  string text = 3;
}

message SendResponse {
  int64 message_id = 1;
}

message ListRequest {
  int64 user_id_1 = 1;
  int64 user_id_2 = 2;
}

message DialogMessage {
  int64 from_user_id = 1;
  int64 to_user_id = 2;
  string text = 3;
  int64 id = 4;
}

message ListResponse {
  repeated DialogMessage messages = 1;
}

message PartnersRequest {
  int64 user_id = 1;
}

message PartnersResponse {
  repeated int64 partner_ids = 1;
}

message MarkReadRequest {
  int64 user_id = 1;
  int64 partner_id = 2;
  int64 up_to_message_id = 3;
}

message MarkReadResponse {
  int64 last_read_message_id = 1;
}

message UnreadCountsRequest {
  int64 user_id = 1;
}

message UnreadCount {
  int64 partner_id = 1;
  int64 count = 2;
}

message UnreadCountsResponse {
  repeated UnreadCount counts = 1;
  int64 total = 2;
}
