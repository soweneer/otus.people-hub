events {
    worker_connections 8192;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_request_id $correlation_id {
        default $http_x_request_id;
        ''      $request_id;
    }

    log_format correlated '$remote_addr - [$time_local] "$request" $status '
                          'x-request-id=$correlation_id ${request_time}s '
                          'upstream=$upstream_addr upstream_status=$upstream_status';

    access_log /dev/stdout correlated;

    upstream app_backend {
        least_conn;
        server app-1:8080 max_fails=2 fail_timeout=5s;
        server app-2:8080 max_fails=2 fail_timeout=5s;
        server app-3:8080 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;
        resolver 127.0.0.11 valid=10s ipv6=off;

        location /post/feed/posted {
            set $feed_backend feed:8082;
            proxy_pass http://$feed_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Request-Id $correlation_id;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
            proxy_connect_timeout 2s;
            proxy_set_header X-Request-Id $correlation_id;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
