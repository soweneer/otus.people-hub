global:
  scrape_interval: 5s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['app-1:8080', 'app-2:8080', 'app-3:8080']
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: node
        replacement: '$1'

  - job_name: postgres
    static_configs:
      - targets: ['pg-exporter-master:9187']
        labels:
          node: pg-master
          role: primary
      - targets: ['pg-exporter-replica-1:9187']
        labels:
          node: pg-replica-1
          role: standby
      - targets: ['pg-exporter-replica-2:9187']
        labels:
          node: pg-replica-2
          role: standby

  - job_name: haproxy
    static_configs:
      - targets: ['haproxy:8404']

  - job_name: nginx
    static_configs:
      - targets: ['nginx-log-exporter:4040']
