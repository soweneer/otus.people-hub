global
    log stdout format raw local0
    maxconn 8192

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 3s
    timeout client 5m
    timeout server 5m
    retries 2

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s

listen pg_read
    bind *:5001
    balance leastconn
    option pgsql-check user postgres
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg-replica-1 pg-replica-1:5432 check
    server pg-replica-2 pg-replica-2:5432 check
